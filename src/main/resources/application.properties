spring.application.name=kunash-website-backend

# ==========================================
# SERVER
# ==========================================
server.port=9092

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+05:30'
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ==========================================
# STATIC ADMIN CREDENTIALS
# ==========================================
admin.email=admin@kunash.com
admin.password=Admin@123!
admin.name=Super Admin

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=your-256-bit-secret-key-for-jwt-generation-change-this-in-production-keep-it-long
jwt.expiration=86400000

# ==========================================
# Logging
# ==========================================
logging.level.com.kunash=DEBUG
logging.level.org.springframework.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# FILE UPLOAD CONFIGURATION - PDF ONLY
# ==========================================
file.upload.dir=uploads/resumes/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


